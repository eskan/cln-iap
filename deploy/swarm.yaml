services:
  traefik:
    volumes:
      - /opt/cln-iap:/plugins-local/src/github.com/eskan/cln-iap:ro
    configs:
      - source: cln_iap_config
        target: /etc/traefik/cln-iap.json
    secrets:
      - cln_iap_jwt
  mon-app:
    deploy:
      labels:
        - "traefik.http.middlewares.mon-app-iap.plugin.cln-iap.allowedLogins=alice,bob"
        - "traefik.http.routers.mon-app.middlewares=mon-app-iap"
configs:
  cln_iap_config:
    file: ./cln-iap.json
secrets:
  cln_iap_jwt:
    external: true
