name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - name: Require full statement coverage
        run: |
          go tool cover -func=cover.out
          awk 'NR > 1 && $NF == 0 { print; missing = 1 } END { exit missing }' cover.out
      - run: RUN_TRAEFIK_TEST=1 go test -run TestTraefik -v .
